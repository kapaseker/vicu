[versions]
agp = "9.4.0"
kotlin = "2.4.10"

smart-exception = "0.2.1"
androidx-annotation = "1.10.0"
compose-activity = "1.13.0"
lifecycle = "2.11.0"
junit = "4.13.2"

sdk-compile = "37"
sdk-min = "29"
version-code = "1"
version-name = "1.0"
compose-bom = "2026.09.00"

[libraries]
smart-exception-java = { group = "com.arthenica", name = "smart-exception-java", version.ref = "smart-exception" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidx-annotation" }
compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "compose-activity" }

lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
com-android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
